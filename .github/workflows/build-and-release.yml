name: Build and Release End-Rage Launcher

on:
  push:
    tags:
      - 'v*' # Triggers on tags starting with v, e.g., v1.0.0
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write # Required to create releases and upload assets

jobs:
  build-and-release:
    name: Build & Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node.js dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Set application version from tag
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          # Remove leading 'v' if present
          VERSION="${VERSION#v}"
          # If version is not semver-like (e.g. branch name "main"), fall back to "1.0.0"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="1.0.0"
          fi
          echo "Setting application version to $VERSION"
          node -e "
            const fs = require('fs');
            
            // Update frontend package.json
            const pkgPath = 'apps/app-frontend/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '$VERSION';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, '\t') + '\n', 'utf8');
            
            // Update app Cargo.toml
            const appCargoPath = 'apps/app/Cargo.toml';
            let appCargo = fs.readFileSync(appCargoPath, 'utf8');
            appCargo = appCargo.replace(/version\s*=\s*\"1\.0\.0-local\"/g, 'version = \"' + '$VERSION' + '\"');
            fs.writeFileSync(appCargoPath, appCargo, 'utf8');
            
            // Update app-lib Cargo.toml
            const libCargoPath = 'packages/app-lib/Cargo.toml';
            let libCargo = fs.readFileSync(libCargoPath, 'utf8');
            libCargo = libCargo.replace(/version\s*=\s*\"1\.0\.0-local\"/g, 'version = \"' + '$VERSION' + '\"');
            fs.writeFileSync(libCargoPath, libCargo, 'utf8');
          "

      - name: Build Web Application frontend
        run: pnpm --filter @erteam/app-frontend build

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "End-Rage Launcher ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
